<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJI Osmo Action 4 · 三维结构拆解</title>
<style>
  :root{
    --bg:#07080a;
    --panel:rgba(15,16,19,.82);
    --panel-solid:#101115;
    --line:rgba(255,255,255,.085);
    --line-strong:rgba(255,255,255,.16);
    --txt:#e9eaee;
    --dim:#8a8d96;
    --dim2:#5f636c;
    --accent:#ffa63d;
    --accent-soft:rgba(255,166,61,.14);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  canvas#c{position:fixed;inset:0;display:block;touch-action:none}

  /* ---------- 背景装饰 ---------- */
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(80% 60% at 50% 42%, rgba(255,166,61,.055), transparent 62%),
      radial-gradient(120% 100% at 50% 118%, rgba(255,255,255,.05), transparent 58%),
      radial-gradient(100% 100% at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%);}
  .frame{position:fixed;inset:16px;pointer-events:none;z-index:2;border:1px solid rgba(255,255,255,.04)}
  .corner{position:fixed;width:14px;height:14px;pointer-events:none;z-index:3;
    border-color:rgba(255,255,255,.22);border-style:solid;border-width:0}
  .corner.tl{top:16px;left:16px;border-top-width:1px;border-left-width:1px}
  .corner.tr{top:16px;right:16px;border-top-width:1px;border-right-width:1px}
  .corner.bl{bottom:16px;left:16px;border-bottom-width:1px;border-left-width:1px}
  .corner.br{bottom:16px;right:16px;border-bottom-width:1px;border-right-width:1px}

  /* ---------- 顶部 ---------- */
  .hud-top{position:fixed;top:26px;left:32px;right:32px;z-index:10;display:flex;
    align-items:flex-start;justify-content:space-between;gap:24px;pointer-events:none}
  .brand{display:flex;gap:13px;align-items:flex-start}
  .brand .bar{width:3px;height:38px;background:linear-gradient(180deg,var(--accent),rgba(255,166,61,.15));
    border-radius:2px;margin-top:2px}
  .brand h1{font-size:19px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;line-height:1.15}
  .brand p{margin-top:6px;font-size:11px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;font-family:var(--mono)}
  .meta{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--dim2);
    font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;padding-top:6px}
  .meta i{display:block;width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.8}
  .meta .sep{width:1px;height:10px;background:var(--line)}

  /* ---------- 面板通用 ---------- */
  .panel{position:fixed;z-index:10;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;backdrop-filter:blur(18px) saturate(1.1);-webkit-backdrop-filter:blur(18px) saturate(1.1);
    box-shadow:0 24px 60px -28px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.045);
    display:flex;flex-direction:column;pointer-events:auto;overflow:hidden}
  .panel-head{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .panel-head span.t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-family:var(--mono)}
  .panel-head .cnt{font-size:10px;font-family:var(--mono);color:var(--accent);
    border:1px solid rgba(255,166,61,.3);background:var(--accent-soft);
    padding:2px 7px;border-radius:5px;letter-spacing:.06em}

  /* ---------- 左侧清单 ---------- */
  .panel.left{top:108px;left:32px;width:266px;max-height:calc(100vh - 218px)}
  #partList{list-style:none;overflow-y:auto;padding:8px;flex:1 1 auto;scrollbar-width:thin}
  #partList::-webkit-scrollbar{width:5px}
  #partList::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  #partList li{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:9px;
    cursor:pointer;transition:background .18s,border-color .18s;border:1px solid transparent;position:relative}
  #partList li:hover{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.07)}
  #partList li.active{background:rgba(255,166,61,.09);border-color:rgba(255,166,61,.28)}
  #partList li .i{font-family:var(--mono);font-size:10px;color:var(--dim2);width:16px;flex:0 0 auto;
    letter-spacing:.02em}
  #partList li.active .i{color:var(--accent)}
  #partList li .n{flex:1 1 auto;min-width:0}
  #partList li .n strong{display:block;font-size:12.5px;font-weight:520;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #partList li .n em{display:block;margin-top:3px;font-style:normal;font-size:10px;color:var(--dim2);
    font-family:var(--mono);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #partList li .st{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.14);flex:0 0 auto;
    transition:background .2s,box-shadow .2s}
  #partList li.on .st{background:var(--accent);box-shadow:0 0 8px 1px rgba(255,166,61,.8)}
  .panel-foot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);flex:0 0 auto}

  .btn{flex:1 1 auto;font-family:inherit;font-size:11.5px;letter-spacing:.06em;padding:9px 10px;
    border-radius:8px;border:1px solid var(--line-strong);background:rgba(255,255,255,.045);
    color:var(--txt);cursor:pointer;transition:all .18s}
  .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#160f04;font-weight:600}
  .btn.primary:hover{background:#ffb455;box-shadow:0 0 20px -4px rgba(255,166,61,.6)}

  /* ---------- 右侧信息 ---------- */
  .panel.right{top:108px;right:32px;width:302px;max-height:calc(100vh - 218px)}
  .scroll{overflow-y:auto;padding:16px;flex:1 1 auto;scrollbar-width:thin}
  .scroll::-webkit-scrollbar{width:5px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .pname{font-size:15px;font-weight:600;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .pname .en{font-size:9.5px;color:var(--dim2);font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .desc{margin-top:9px;font-size:11.5px;line-height:1.75;color:#a7aab2}
  .sec{margin-top:16px}
  .sec .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);
    font-family:var(--mono);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .sec .k::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px dashed rgba(255,255,255,.055);font-size:11.5px}
  .row:last-child{border-bottom:0}
  .row span{color:var(--dim)}
  .row b{font-weight:500;font-family:var(--mono);font-size:11px;color:#dcdde2;text-align:right;letter-spacing:.01em}
  .pfoot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding-top:13px;border-top:1px solid var(--line)}
  .state{font-size:10px;font-family:var(--mono);letter-spacing:.1em;color:var(--dim2);
    display:flex;align-items:center;gap:6px}
  .state::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--dim2)}
  .state.on{color:var(--accent)}
  .state.on::before{background:var(--accent);box-shadow:0 0 7px 1px rgba(255,166,61,.75)}
  .mini{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:6px 12px;border-radius:6px;
    border:1px solid rgba(255,166,61,.35);background:rgba(255,166,61,.1);color:var(--accent);cursor:pointer;
    text-transform:uppercase;transition:all .18s}
  .mini:hover{background:rgba(255,166,61,.2)}

  /* ---------- 底部提示 & 操作 ---------- */
  .hud-bottom{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:18px;padding:10px 20px;border-radius:100px;
    background:rgba(13,14,17,.72);border:1px solid var(--line);backdrop-filter:blur(16px);
    font-size:10.5px;color:var(--dim);letter-spacing:.09em;white-space:nowrap;pointer-events:none}
  .hud-bottom b{font-family:var(--mono);color:#cfd1d7;font-weight:500;letter-spacing:.1em}
  .hud-bottom .d{width:1px;height:11px;background:var(--line)}

  .hud-actions{position:fixed;bottom:26px;right:32px;z-index:10;display:flex;gap:8px;align-items:center}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:9px 13px;border-radius:8px;border:1px solid var(--line);background:rgba(15,16,19,.8);
    color:var(--dim);cursor:pointer;transition:all .18s;backdrop-filter:blur(14px)}
  .chip:hover{color:var(--txt);border-color:var(--line-strong)}
  .chip.active{color:var(--accent);border-color:rgba(255,166,61,.32);background:rgba(255,166,61,.1)}
  .chip.accent{color:#160f04;background:var(--accent);border-color:var(--accent);font-weight:600}

  /* ---------- 3D 标注 ---------- */
  #labels{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
  .label{position:absolute;top:0;left:0;opacity:0;transition:opacity .28s ease;
    display:flex;flex-direction:column;align-items:center;gap:0;will-change:transform}
  .label.show{opacity:1}
  .label .box{padding:5px 9px 6px;border-radius:7px;background:rgba(10,11,14,.82);
    border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(10px);text-align:center;
    box-shadow:0 8px 24px -12px rgba(0,0,0,.9);transition:border-color .25s,background .25s}
  .label .lname{display:block;font-size:10.5px;letter-spacing:.06em;color:#eceef2;white-space:nowrap}
  .label .lspec{display:block;margin-top:2px;font-size:9px;font-family:var(--mono);
    letter-spacing:.06em;color:var(--accent);white-space:nowrap;opacity:.92}
  .label .stem{width:1px;height:20px;background:linear-gradient(180deg,rgba(255,166,61,.75),rgba(255,166,61,.1))}
  .label .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 8px 2px rgba(255,166,61,.55);margin-bottom:1px}
  .label.sel .box{border-color:rgba(255,166,61,.55);background:rgba(28,20,10,.9)}

  /* ---------- 载入 ---------- */
  #loader{position:fixed;inset:0;z-index:50;background:#07080a;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
  #loader.done{opacity:0;pointer-events:none}
  #loader .ring{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
    border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--dim2)}
  #loader .err{display:none;max-width:320px;text-align:center;font-size:11.5px;line-height:1.7;color:#d98a8a}
  #loader.fail .ring{display:none}
  #loader.fail .err{display:block}

  @media (max-width:1180px){
    .panel.right{width:270px}
    .panel.left{width:238px}
  }
  @media (max-width:980px){
    .hud-top{left:20px;right:20px;top:18px}
    .panel.left{left:20px;top:92px;width:214px;max-height:calc(100vh - 200px)}
    .panel.right{display:none}
    .hud-bottom{display:none}
    .hud-actions{right:20px;bottom:20px}
    .meta{display:none}
  }
  @media (max-width:560px){
    .label .lspec{display:none}
    .label .box{padding:4px 8px 5px}
    .label .lname{font-size:10px}
    .label .stem{height:14px}
  }
  @media (max-width:700px){
    .panel.left{display:none}
    .brand h1{font-size:15px}
    .hud-actions{left:20px;right:20px;justify-content:center;flex-wrap:wrap}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="frame"></div>
<i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

<header class="hud-top">
  <div class="brand">
    <span class="bar"></span>
    <div>
      <h1>DJI Osmo Action 4</h1>
      <p>三维结构拆解 · Exploded View</p>
    </div>
  </div>
  <div class="meta">
    <i></i><span>Procedural Geometry</span>
    <span class="sep"></span><span>1 : 1 比例建模</span>
    <span class="sep"></span><span>9 个可拆部件</span>
  </div>
</header>

<aside class="panel left">
  <div class="panel-head">
    <span class="t">部件清单 / Parts</span>
    <span class="cnt" id="cnt">09</span>
  </div>
  <ul id="partList"></ul>
  <div class="panel-foot">
    <button class="btn primary" id="btnAll">全部拆解</button>
    <button class="btn" id="btnReset">复位</button>
  </div>
</aside>

<aside class="panel right">
  <div class="panel-head">
    <span class="t" id="infoTitle">整机规格</span>
    <span class="cnt" id="infoTag">SPEC</span>
  </div>
  <div class="scroll" id="infoBody"></div>
</aside>

<div class="hud-bottom">
  <span><b>拖拽</b> 旋转视角</span><span class="d"></span>
  <span><b>滚轮</b> 缩放</span><span class="d"></span>
  <span><b>单击部件</b> 拆解 / 详情</span><span class="d"></span>
  <span><b>双击空白</b> 复位</span>
</div>

<div class="hud-actions">
  <button class="chip active" id="chipRotate">自动旋转</button>
  <button class="chip active" id="chipLabels">标注</button>
  <button class="chip accent" id="chipExplode">全部拆解</button>
</div>

<div id="labels"></div>

<div id="loader">
  <div class="ring"></div>
  <div class="lbl">建构几何体中</div>
  <div class="err">Three.js 资源加载失败，请检查网络连接后刷新页面。</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   0. 常量（1 单位 = 10 mm，机身 70.5 × 44.2 × 32.8 mm）
   ========================================================= */
const W = 7.05, H = 4.42, D = 3.28;      // 宽 / 高 / 厚
const ACC = 0xffa63d;
const ACC_C = new THREE.Color(ACC);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const canvasEl = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080a);
scene.fog = new THREE.Fog(0x07080a, 30, 62);

const QS = new URLSearchParams(location.search);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);
const BASE_R = parseFloat(QS.get('r') || '26.5');
const homeSph = new THREE.Spherical(BASE_R, THREE.MathUtils.degToRad(70), THREE.MathUtils.degToRad(40));
camera.position.setFromSpherical(homeSph);
camera.lookAt(0, 0, 0);

/* 环境反射：用程序化房间环境生成 PMREM，保证金属质感 */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;

/* 灯光 */
const keyLight = new THREE.DirectionalLight(0xfff2e4, 2.7); keyLight.position.set(7.5, 9, 8);
const rimLight = new THREE.DirectionalLight(0xc2d4ea, 2.6); rimLight.position.set(-8, 4.5, -7.5);
const fillLight = new THREE.DirectionalLight(0xffffff, 1.1); fillLight.position.set(2, 1.5, 9);
const botLight = new THREE.DirectionalLight(0xffffff, 0.5); botLight.position.set(0, -6, 5);
const accLight = new THREE.PointLight(ACC, 3.2, 14, 2); accLight.position.set(-4.2, -3.4, 4.2);
scene.add(keyLight, rimLight, fillLight, botLight, accLight);

/* =========================================================
   2. 后期：Bloom 发光
   ========================================================= */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.36, 0.66, 0.88);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* =========================================================
   3. 舞台：网格 / 光环 / 光雾 / 粒子
   ========================================================= */
const STAGE_Y = -6.3;
const stage = new THREE.Group();
scene.add(stage);

const grid = new THREE.GridHelper(46, 46, 0x39404b, 0x1b2028);
grid.position.y = STAGE_Y;
grid.material.transparent = true;
grid.material.opacity = 0.55;
stage.add(grid);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(6.55, 6.62, 160),
  new THREE.MeshBasicMaterial({ color: ACC, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = STAGE_Y + 0.02;
stage.add(ring);

const ring2 = new THREE.Mesh(
  new THREE.RingGeometry(9.4, 9.44, 160),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.07, side: THREE.DoubleSide })
);
ring2.rotation.x = -Math.PI / 2;
ring2.position.y = STAGE_Y + 0.02;
stage.add(ring2);

function radialTex(inner) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, inner);
  g.addColorStop(0.4, 'rgba(255,166,61,.05)');
  g.addColorStop(1, 'rgba(255,166,61,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const pool = new THREE.Mesh(
  new THREE.PlaneGeometry(19, 19),
  new THREE.MeshBasicMaterial({ map: radialTex('rgba(255,166,61,.16)'), transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false })
);
pool.rotation.x = -Math.PI / 2;
pool.position.y = STAGE_Y + 0.03;
stage.add(pool);

/* 粒子尘埃 */
(function dust() {
  const N = 900, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 11 + Math.random() * 20;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(THREE.MathUtils.randFloatSpread(1.7));
    pos[i * 3] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.6 + 1.5;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0x9aa3b0, size: 0.055, transparent: true,
    opacity: 0.55, depthWrite: false, sizeAttenuation: true });
  const pts = new THREE.Points(geo, mat);
  pts.name = 'dust';
  scene.add(pts);
})();

/* =========================================================
   4. 画布贴图（屏幕 UI / Logo）
   ========================================================= */
function makeCanvas(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  return { cv, ctx: cv.getContext('2d') };
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function texFrom(cv) {
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* =========================================================
   5. 材质工厂（每部件独立实例，避免共享材质串染高亮）
   ========================================================= */
const mat = {
  shell:     (c = 0x24272e, r = 0.34) => new THREE.MeshStandardMaterial({ color: c, metalness: 0.78, roughness: r }),
  gloss:     (c = 0x101319) => new THREE.MeshPhysicalMaterial({ color: c, metalness: 0.55, roughness: 0.14,
                              clearcoat: 1, clearcoatRoughness: 0.08 }),
  darkMetal: (c = 0x15181d, r = 0.42) => new THREE.MeshStandardMaterial({ color: c, metalness: 0.82, roughness: r }),
  brightMet: (c = 0x424954, r = 0.24) => new THREE.MeshStandardMaterial({ color: c, metalness: 0.96, roughness: r }),
  rubber:    () => new THREE.MeshStandardMaterial({ color: 0x0d0f12, metalness: 0.1, roughness: 0.88 }),
  glass:     () => { const m = new THREE.MeshPhysicalMaterial({ color: 0x04070c, metalness: 0.0, roughness: 0.3,
                              clearcoat: 0.0, envMapIntensity: 0.3,
                              transparent: true, opacity: 0.4, depthWrite: false });
                     m.userData.keepEnv = true; return m; },
  emissive:  (c = ACC, i = 1.6) => new THREE.MeshStandardMaterial({ color: 0x1a1206, emissive: c,
                              emissiveIntensity: i, metalness: 0.2, roughness: 0.5 }),
};

/* 统一调整环境贴图强度（保留标记为 keepEnv 的材质，如镜片） */
function tuneEnv(root) {
  root.traverse(o => {
    if (o.isMesh) {
      const arr = Array.isArray(o.material) ? o.material : [o.material];
      arr.forEach(m => { if ('envMapIntensity' in m && !m.userData.keepEnv) m.envMapIntensity = 0.85; });
    }
  });
}

/* 菲涅尔边缘光壳层：只在掠射角发光，不破坏材质细节 */
const GLOW_VERT = `
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vN = normalize(normalMatrix * normal);
    vV = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }`;
const GLOW_FRAG = `
  uniform vec3 uColor;
  uniform float uPower;
  uniform float uIntensity;
  varying vec3 vN;
  varying vec3 vV;
  void main() {
    float ndv = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
    // 只在接近掠射角的窄带内发光，保留部件主体材质细节
    float rim = smoothstep(0.66, 0.02, ndv);
    float a = pow(rim, uPower * 0.45) * uIntensity;
    gl_FragColor = vec4(uColor * a, a);
  }`;

function makeGlowShell(group) {
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(ACC) },
      uPower: { value: 2.0 },
      uIntensity: { value: 0.0 },
    },
    vertexShader: GLOW_VERT,
    fragmentShader: GLOW_FRAG,
    transparent: true,
    blending: THREE.CustomBlending,
    blendEquation: THREE.MaxEquation,
    blendSrc: THREE.OneFactor,
    blendDst: THREE.OneFactor,
    depthWrite: false,
    toneMapped: false,
  });
  const targets = [];
  group.traverse(o => { if (o.isMesh && !o.userData.isGlow) targets.push(o); });
  targets.forEach(o => {
    const shell = new THREE.Mesh(o.geometry, mat);
    shell.scale.setScalar(1.024);
    shell.userData.isGlow = true;
    shell.raycast = () => {};
    o.add(shell);
  });
  return mat;
}

    def, id: def.id, group: g, base: g.position.clone(),
    t: 0, target: 0, glow: 0, glowTarget: 0, exploded: false, mats: [], glowMat,
  };
  const seen = new Set();
  g.traverse(o => {
    if (!o.isMesh || o.userData.isGlow) return;
    pickables.push(o);
    const arr = Array.isArray(o.material) ? o.material : [o.material];
    arr.forEach(m => {
      if (m && m.emissive && !seen.has(m)) {
        seen.add(m);
        p.mats.push({ m, base: m.emissive.clone(), inten: m.emissiveIntensity });
      }
    });
  });
  parts.push(p);
});

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let selected = null, hovered = null;

function pickAt(clientX, clientY) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (!hits.length) return null;
  const id = hits[0].object.userData.partId;
  return id ? partById(id) : null;
}

let downX = 0, downY = 0, downT = 0;
renderer.domElement.addEventListener('pointerdown', e => {
  downX = e.clientX; downY = e.clientY; downT = performance.now();
});
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  if (performance.now() - downT > 700) return;
  const p = pickAt(e.clientX, e.clientY);
  if (!p) { select(null); return; }
  activate(p);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (e.buttons) return;
  const p = pickAt(e.clientX, e.clientY);
  if (p !== hovered) {
    hovered = p;
    updateGlow();
    renderer.domElement.style.cursor = p ? 'pointer' : 'grab';
  }
});
renderer.domElement.addEventListener('dblclick', () => resetAll());
renderer.domElement.style.cursor = 'grab';

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { select(null); }
  if (e.code === 'Space') { e.preventDefault(); toggleAll(); }
});

/* 点击 / 清单选择：选中 + 切换拆解 */
function activate(p) {
  select(p);
  if (p.id === 'body') {
    // 点击机身 = 收拢所有已拆部件
    if (parts.some(q => q.exploded)) parts.forEach(q => setExploded(q, false));
  } else {
    setExploded(p, !p.exploded);
  }
}

function updateGlow() {
  const n = parts.filter(q => q.exploded).length;
  const base = n > 0 ? (n <= 2 ? 0.55 : 0.38) : 0;   // 拆出的部件常驻边缘光
  parts.forEach(q => {
    q.glowTarget = (selected === q || hovered === q) ? 1 : (q.exploded ? base : 0);
  });
}

function select(p) {
  selected = p;
  updateGlow();
  renderInfo();
  syncList();
  syncLabels();
}

function setExploded(p, v) {
  p.exploded = v;
  p.target = v ? 1 : 0;
  syncList();
  updateGlow();
  if (!selected) renderInfo();
}

function toggleAll() {
  const anyClosed = parts.some(p => !p.exploded && p.def.explode.lengthSq() > 0);
  parts.forEach(p => {
    if (p.def.explode.lengthSq() === 0) return;
    setExploded(p, anyClosed);
  });
  document.getElementById('chipExplode').textContent = anyClosed ? '全部组装' : '全部拆解';
  document.getElementById('btnAll').textContent = anyClosed ? '全部组装' : '全部拆解';
}

function resetAll() {
  parts.forEach(p => { p.exploded = false; p.target = 0; });
  hovered = null;
  updateGlow();
  select(null);
  controls.target.set(0, 0, 0);
  controls.autoRotate = autoRotateWanted;
  document.getElementById('chipExplode').textContent = '全部拆解';
  document.getElementById('btnAll').textContent = '全部拆解';
  // 相机回到初始方位
  const dir = new THREE.Vector3().setFromSpherical(homeSph).normalize();
  camGoal = { on: true, pos: dir.multiplyScalar(BASE_R) };
}

const tmpV = new THREE.Vector3();

function syncLabels() {
  PARTS.forEach(p => {
    const el = labelEls.get(p.id);
    const isSel = selected && selected.id === p.id;
    el.classList.toggle('sel', !!isSel);
  });

function updateLabels() {
  const w = innerWidth, h = innerHeight;
  const anyExploded = parts.some(p => p.exploded);
  parts.forEach(p => {
    const el = labelEls.get(p.id);
    const isSel = selected === p;
    const isHover = hovered === p;
    let show = (p.exploded || isSel || isHover) && labelsOn;
    if (p.id === 'body') show = labelsOn && (!anyExploded || isSel || isHover);
    if (!show) { el.classList.remove('show'); return; }

    tmpV.copy(p.group.position).add(p.def.label);
    const dist = tmpV.distanceTo(camera.position);
    tmpV.project(camera);
    if (tmpV.z > 1) { el.classList.remove('show'); return; }
    const x = (tmpV.x * 0.5 + 0.5) * w;
    const y = (-tmpV.y * 0.5 + 0.5) * h;
    if (x < -160 || x > w + 160 || y < -120 || y > h + 120) { el.classList.remove('show'); return; }
    el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    el.style.opacity = dist > 34 ? '0.45' : '1';
    el.classList.add('show');
  });
}

const TMP_C = new THREE.Color();

let introT = 0;
let autoDist = BASE_R;                       // 上一次自动构图距离
const splittable = parts.filter(p => p.def.explode.lengthSq() > 0).length;

/* 竖屏/窄屏按可视宽度补充机位距离，避免拆解后左右被裁切 */
function fitDist(base, needW) {
  const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const need = needW / (2 * Math.tan(halfFov) * camera.aspect);
  return Math.max(base, need);
}
function frameDist(ratio) {
  return fitDist(lerp(NEAR_R, BASE_R, ratio), lerp(9.4, 17, ratio));
}

function autoFrame(dt, ratio) {
  const targetD = frameDist(ratio);
  const curD = camera.position.distanceTo(controls.target);
  // 仅在用户未手动缩放时介入
  if (Math.abs(curD - autoDist) > 0.9) return;
  const nd = lerp(curD, targetD, Math.min(1, dt * 3));
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, nd);
  autoDist = nd;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  /* 拆解插值 */
  parts.forEach(p => {
    if (p.t !== p.target) {
      p.t += (p.target - p.t) * Math.min(1, dt * 5.5);
      if (Math.abs(p.target - p.t) < 0.002) p.t = p.target;
      const e = easeIO(p.t);
      p.group.position.copy(p.base).addScaledVector(p.def.explode, e);
    }
    /* 高亮插值 */
    if (Math.abs(p.glow - p.glowTarget) > 0.001) {
      p.glow += (p.glowTarget - p.glow) * Math.min(1, dt * 9);
    }
    TMP_C.copy(ACC_C).multiplyScalar(p.glow * 0.1);
    p.mats.forEach(r => {
      r.m.emissive.copy(r.base).add(TMP_C);
      r.m.emissiveIntensity = r.inten;
    });
    if (p.glowMat) p.glowMat.uniforms.uIntensity.value = p.glow * 1.0;
  });

  /* 舞台旋转 */
  stage.rotation.y += dt * 0.06;
  ring.material.opacity = 0.28 + Math.sin(performance.now() * 0.0012) * 0.1;

  /* 自动旋转回补 */
  if (autoRotateWanted) {
    idle += dt;
    if (idle > 4 && !controls.autoRotate) controls.autoRotate = true;
  }

  /* 开场推近 */
  if (introT < 1) {
    introT = Math.min(1, introT + dt / 1.7);
    const k = 1 - Math.pow(1 - introT, 3);
    const introTarget = frameDist(QS.has('explode') ? 1 : 0);
    const targetR = lerp(BASE_R * 1.62, introTarget, k);
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, targetR);
    if (introT >= 1) autoDist = camera.position.distanceTo(controls.target);
  }

  /* 自动构图：部件拆出程度决定机位远近 */
  let exSum = 0;
  parts.forEach(p => { if (p.def.explode.lengthSq() > 0) exSum += p.t; });
  if (introT >= 1 && !camGoal) autoFrame(dt, exSum / splittable);

  /* 复位相机 */
  if (camGoal && camGoal.on) {
    camera.position.lerp(camGoal.pos, Math.min(1, dt * 4));
    if (camera.position.distanceTo(camGoal.pos) < 0.12) { camGoal = null; autoDist = camera.position.distanceTo(controls.target); }
  }

  controls.update();
  composer.render();
  updateLabels();
}

/* =========================================================
   13. 尺寸自适应
   ========================================================= */
let resizeTimer = null;
function onResize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  // 窄屏按可视宽度拉远，保证拆解后的横向范围不被裁切
  const ratio = parts.filter(p => p.def.explode.lengthSq() > 0)
    .reduce((a, p) => a + p.t, 0) / splittable;
  const r = frameDist(ratio);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, r);
  autoDist = r;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
}
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(onResize, 120);
});

/* =========================================================
   14. 启动
   ========================================================= */
renderInfo();
syncList();
syncLabels();

/* 深链：?explode=1 直接展开全部 / ?p=lens 预选部件 */
if (QS.has('explode')) {
  parts.forEach(p => {
    if (p.def.explode.lengthSq() === 0) return;
    p.exploded = true; p.target = 1; p.t = 1;
    p.group.position.copy(p.base).add(p.def.explode);
  });
  document.getElementById('chipExplode').textContent = '全部组装';
  document.getElementById('btnAll').textContent = '全部组装';
  syncList();
  updateGlow();
  renderInfo();
}
if (QS.has('p')) select(partById(QS.get('p')) || null);
document.getElementById('chipRotate').classList.toggle('active', autoRotateWanted);

// 首屏按当前宽高比校正机位
{
  const r0 = frameDist(QS.has('explode') ? 1 : 0);
  const d0 = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(d0, r0);
  autoDist = r0;
}

/* 静态快照模式：跳过开场动画，直接落到最终机位（便于分享/截图） */
if (QS.has('snap')) {
  introT = 1;
  updateGlow();
  let sum = 0;
  parts.forEach(p => { if (p.def.explode.lengthSq() > 0) sum += p.t; if (p.def.explode.lengthSq() > 0) p.group.position.copy(p.base).addScaledVector(p.def.explode, easeIO(p.t)); p.glow = p.glowTarget; });
  const r = frameDist(sum / splittable);
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, r);
  autoDist = r;
}

animate();

const loader = document.getElementById('loader');
requestAnimationFrame(() => {
  setTimeout(() => {
    loader.classList.add('done');
    setTimeout(() => loader.remove(), 800);
  }, 320);
});
window.__ready = true;

/* CDN 失败兜底提示 */
setTimeout(() => {
  if (!window.__ready) {
    document.getElementById('loader').classList.add('fail');
  }
}, 9000);
</script>
